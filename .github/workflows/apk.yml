name: Android APK

# Builds an installable APK and attaches it to the run, so a phone build does
# not need a local Android toolchain. Runs on every push to develop, and on
# demand from the Actions tab.
on:
  push:
    branches: ["develop"]
  workflow_dispatch:

# The release step needs to write to the repository.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # The runner ships a JDK, but the one Flutter's Gradle plugin expects for
      # this Android Gradle Plugin version is 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Generated localisations are not committed.
      - name: Generate localisations
        run: flutter gen-l10n

      # A phone build that fails the suite is not worth installing.
      - name: Test
        run: flutter test

      # One APK per ABI rather than a single fat one: the universal build
      # carries every architecture and is roughly three times the size of the
      # one a given phone actually needs. Nearly every phone in use is
      # arm64-v8a; the others are here so an older or emulated device is not
      # left without a build.
      - name: Build APKs
        run: flutter build apk --release --split-per-abi

      # And a universal APK as well, for anyone who does not know their ABI and
      # would rather install the one that always works.
      - name: Build universal APK
        run: flutter build apk --release

      - name: Name the outputs
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/*.apk artifacts/
          ls -lh artifacts

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: philosophia-apk
          path: artifacts/*.apk
          retention-days: 30

      # An artifact is a zip behind a login, which is an awkward thing to open
      # on a phone. A release asset is a direct download, so installing is
      # tapping a link. The tag is moved rather than added to, so there is one
      # place to go for the current build instead of a list that grows on
      # every push.
      - name: Publish the build as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=latest
          NOTES="Built from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC').

          Install **app-arm64-v8a-release.apk** unless you know your phone
          needs another. Nearly every phone made since 2017 is arm64-v8a.
          app-release.apk is the universal build: it works everywhere and is
          about three times the size.

          Signed with a debug key, so Android will ask you to allow
          installation from this source."
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" artifacts/*.apk \
            --title "Philosophia (latest)" \
            --notes "$NOTES" \
            --latest
