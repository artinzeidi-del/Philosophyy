name: philosophyy
description: >-
  Philosophia — a bilingual (فارسی/English) reference, library and learning
  platform for world philosophy.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  intl: ^0.20.3
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/content/
    - assets/fonts/vazirmatn/OFL.txt
    - assets/fonts/spectral/OFL.txt
    - assets/fonts/gfsdidot/OFL.txt
    - assets/fonts/notonaskharabic/OFL.txt
    - assets/fonts/notoserifcjk/OFL.txt
    - assets/fonts/notoserifdevanagari/OFL.txt

  fonts:
    # Persian. Flutter's default font carries no Arabic-script coverage, so the
    # Persian half of a bilingual product is unreadable without a bundled face.
    # Vazirmatn is the de-facto open Persian UI family. SIL OFL 1.1.
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/vazirmatn/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/vazirmatn/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/vazirmatn/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/vazirmatn/Vazirmatn-Bold.ttf
          weight: 700

    # The Persian reading face. Vazirmatn above is a UI sans and stays for
    # chrome; setting long-form Persian in it made the reading surface feel like
    # an interface rather than a book. Naskh is what a Persian book is set in,
    # and it pairs with Spectral the way Vazirmatn — geometric and screen-drawn
    # — does not.
    #
    # Amiri was the other candidate and is the more beautiful face, but it
    # applies Arabic conventions to Persian: a dotted final yeh in آتنی‌ای,
    # where Persian writes it bare. Wrong letterforms are not a style choice.
    # SIL OFL 1.1.
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/notonaskharabic/NotoNaskhArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/notonaskharabic/NotoNaskhArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/notonaskharabic/NotoNaskhArabic-Bold.ttf
          weight: 700

    # English reading serif. Spectral is drawn for sustained on-screen reading,
    # which is what this product asks of it. SIL OFL 1.1.
    - family: Spectral
      fonts:
        - asset: assets/fonts/spectral/Spectral-Regular.ttf
          weight: 400
        - asset: assets/fonts/spectral/Spectral-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/spectral/Spectral-Medium.ttf
          weight: 500
        - asset: assets/fonts/spectral/Spectral-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/spectral/Spectral-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/spectral/Spectral-Bold.ttf
          weight: 700

    # Polytonic Greek. Spectral covers the modern Greek block but not Greek
    # Extended, so accented classical forms — the initial letters of Ἐπίκτητος
    # and Ἀριστοτέλης — render as empty boxes without this. SIL OFL 1.1.
    - family: GFSDidot
      fonts:
        - asset: assets/fonts/gfsdidot/GFSDidot-Regular.ttf

    # Chinese, Japanese and Korean. None of the faces above carry a single CJK
    # glyph, so 孔子 printed as two empty boxes — a reference work failing to
    # print the name of a philosopher it has an article about.
    #
    # Three faces rather than one because Han unification gives the writing
    # systems the same codepoint for characters they draw differently; one face
    # would set every Japanese name in Chinese letterforms. Each is subset to
    # its own national standard by tool/subset_cjk_fonts.py, which takes the
    # three together from ~25 MB to ~7 MB. SIL OFL 1.1.
    - family: NotoSerifSC
      fonts:
        - asset: assets/fonts/notoserifcjk/NotoSerifSC-Subset.ttf
    - family: NotoSerifJP
      fonts:
        - asset: assets/fonts/notoserifcjk/NotoSerifJP-Subset.ttf
    - family: NotoSerifKR
      fonts:
        - asset: assets/fonts/notoserifcjk/NotoSerifKR-Subset.ttf

    # Devanagari. Found by the script-coverage test the moment it was written:
    # every Sanskrit term in the Indian philosophy entries — शून्यता, धर्म,
    # ब्रह्मन् — was rendering as a row of empty boxes. Unsubset, because the
    # whole face is 280 KB. SIL OFL 1.1.
    - family: NotoSerifDevanagari
      fonts:
        - asset: assets/fonts/notoserifdevanagari/NotoSerifDevanagari-Regular.ttf
